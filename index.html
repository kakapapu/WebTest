<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ thống tài liệu nội bộ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="container topbar">
      <div class="brand">
        <h1>Hệ thống chia sẻ tài liệu nội bộ</h1>
        <p>Phòng ban • Tài liệu • Quy trình • Biểu mẫu</p>
      </div>

      <div class="stats">
        <div class="stat-box">
          <strong id="totalCount">0</strong>
          <span>Tài liệu</span>
        </div>
        <div class="stat-box">
          <strong>6</strong>
          <span>Bộ phận</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="search-panel">
      <form id="searchForm">
        <div class="search-grid">
          <div class="input-wrap">
            <label for="searchInput">Tìm tài liệu</label>
            <input id="searchInput" type="text" placeholder="Nhập tên tài liệu, mã tài liệu, từ khóa..." />
          </div>

          <div class="input-wrap">
            <label for="departmentSelect">Bộ phận</label>
            <select id="departmentSelect">
              <option value="">Tất cả</option>
              <option value="Kinh doanh">Kinh doanh</option>
              <option value="Kỹ thuật">Kỹ thuật</option>
              <option value="Nhân sự">Nhân sự</option>
              <option value="Tài chính">Tài chính</option>
              <option value="Hành chính">Hành chính</option>
              <option value="Marketing">Marketing</option>
            </select>
          </div>

          <div class="input-wrap">
            <label for="categorySelect">Danh mục</label>
            <select id="categorySelect">
              <option value="">Tất cả</option>
              <option value="Báo giá">Báo giá</option>
              <option value="Quy trình">Quy trình</option>
              <option value="Hướng dẫn">Hướng dẫn</option>
              <option value="Checklist">Checklist</option>
              <option value="Quy định">Quy định</option>
              <option value="Tài chính">Tài chính</option>
              <option value="Văn bản">Văn bản</option>
              <option value="Marketing">Marketing</option>
            </select>
          </div>
        </div>

        <div class="doc-actions" style="margin-top: 16px;">
          <button type="submit" class="btn-primary">🔎 Tìm kiếm</button>
          <button type="button" id="clearBtn" class="btn-secondary">Xóa bộ lọc</button>
        </div>
      </form>
    </section>

    <section class="upload-panel">
      <div class="panel-head">
        <h2>Upload tài liệu nội bộ</h2>
        <span>Phù hợp cho khoảng 50 người dùng trong công ty</span>
      </div>

      <form id="uploadForm" enctype="multipart/form-data">
        <div class="upload-grid">
          <div class="input-wrap">
            <label for="maTaiLieu">Mã tài liệu</label>
            <input id="maTaiLieu" name="ma_tai_lieu" type="text" placeholder="VD: KD-010" required />
          </div>

          <div class="input-wrap">
            <label for="tenTaiLieu">Tên tài liệu</label>
            <input id="tenTaiLieu" name="ten_tai_lieu" type="text" placeholder="Nhập tên tài liệu" required />
          </div>

          <div class="input-wrap">
            <label for="uploadDepartment">Bộ phận</label>
            <select id="uploadDepartment" name="bo_phan_id" required>
              <option value="">Chọn bộ phận</option>
              <option value="1">Kinh doanh</option>
              <option value="2">Kỹ thuật</option>
              <option value="3">Nhân sự</option>
              <option value="4">Tài chính</option>
              <option value="5">Hành chính</option>
              <option value="6">Marketing</option>
            </select>
          </div>

          <div class="input-wrap">
            <label for="uploadCategory">Danh mục</label>
            <select id="uploadCategory" name="danh_muc" required>
              <option value="">Chọn danh mục</option>
              <option value="Báo giá">Báo giá</option>
              <option value="Quy trình">Quy trình</option>
              <option value="Hướng dẫn">Hướng dẫn</option>
              <option value="Checklist">Checklist</option>
              <option value="Quy định">Quy định</option>
              <option value="Tài chính">Tài chính</option>
              <option value="Văn bản">Văn bản</option>
              <option value="Marketing">Marketing</option>
            </select>
          </div>
        </div>

        <div class="upload-grid secondary-grid">
          <div class="input-wrap">
            <label for="uploadVersion">Phiên bản</label>
            <input id="uploadVersion" name="version" type="text" value="1.0" />
          </div>

          <div class="input-wrap">
            <label for="uploadFile">Tệp tài liệu</label>
            <input id="uploadFile" name="file" type="file" required />
          </div>
        </div>

        <div class="input-wrap">
          <label for="uploadDescription">Mô tả</label>
          <textarea id="uploadDescription" name="mo_ta" rows="3" placeholder="Mô tả ngắn về tài liệu, mục đích và đối tượng sử dụng."></textarea>
        </div>

        <div class="doc-actions upload-actions">
          <button type="submit" class="btn-primary">📤 Tải lên</button>
        </div>

        <div id="uploadStatus" class="status-box" aria-live="polite"></div>
      </form>
    </section>

    <div class="results-header">
      <h2>Kết quả tra cứu</h2>
      <span id="depSummary">Đang tải...</span>
    </div>

    <section id="results" class="result-list"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
